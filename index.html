<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almacén de la tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen mobile app — sticky header, scrolling list, fixed bottom tab bar with a central scan button; details open as full sheets. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#18202e; --muted:#5d6676; --line:#dde1e7;
  --accent:#2457c5; --accent-ink:#ffffff; --accent-soft:#e6edfb;
  --ok:#1b7f47; --ok-soft:#e3f3ea; --low:#a85f00; --low-soft:#fbefdc; --out:#c3352b; --out-soft:#fbe5e3;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f141c; --surface:#18202b; --ink:#e8ecf2; --muted:#98a2b3; --line:#2a3442;
    --accent:#6f9bff; --accent-ink:#0b1020; --accent-soft:#1d2a45;
    --ok:#4cc584; --ok-soft:#163324; --low:#f0a73a; --low-soft:#3a2a12; --out:#ff7a6e; --out-soft:#3d1d1b;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#18202b; --ink:#e8ecf2; --muted:#98a2b3; --line:#2a3442;
  --accent:#6f9bff; --accent-ink:#0b1020; --accent-soft:#1d2a45;
  --ok:#4cc584; --ok-soft:#163324; --low:#f0a73a; --low-soft:#3a2a12; --out:#ff7a6e; --out-soft:#3d1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px !important}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header{padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;background:var(--bg);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:700 30px/1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase}
h1 small{display:block;font:500 12px/1.2 var(--body);letter-spacing:.04em;color:var(--muted);text-transform:none;margin-top:4px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--out);border:1px solid var(--out)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:left;cursor:pointer}
.stat b{display:block;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.low b{color:var(--low)} .stat.out b{color:var(--out)}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.search{margin-top:10px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px 11px 38px;min-height:44px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip.edit{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{flex:1;overflow-y:auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 96px)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 8px 8px;text-align:left;width:100%;position:relative;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok)}
.row.low::before{background:var(--low)} .row.out::before{background:var(--out)}
.thumb{width:52px;height:52px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden;color:var(--accent);font:700 20px var(--display)}
.thumb img{width:100%;height:100%;object-fit:cover}
.rname{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.rmeta{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.qty{text-align:right}
.qty b{display:block;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.qty span{font-size:11.5px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--ok-soft);color:var(--ok);margin-top:3px}
.pill.low{background:var(--low-soft);color:var(--low)} .pill.out{background:var(--out-soft);color:var(--out)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty h2{font:700 24px var(--display);color:var(--ink);margin:0 0 6px;text-transform:uppercase}
.empty p{margin:0 auto 16px;max-width:30ch}
.banner{margin:0 0 10px;padding:10px 12px;border-radius:10px;background:var(--low-soft);color:var(--low);font-size:13.5px}
.banner.err{background:var(--out-soft);color:var(--out)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav .inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted);padding:6px 0;position:relative}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;top:2px;right:calc(50% - 18px);background:var(--out);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.scanbtn{justify-self:center;width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px rgba(36,87,197,.35)}
.scanlbl{display:block;text-align:center;font-size:11.5px;font-weight:600;color:var(--accent);margin-top:2px}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sheethead{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheethead h2{flex:1;margin:0;font:700 22px/1.1 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.iconbtn{border:0;background:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.sheetbody{flex:1;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 24px)}
.sheetbody>*{max-width:608px;margin-left:auto;margin-right:auto}
.photo{width:100%;aspect-ratio:4/3;border-radius:var(--r);background:var(--accent-soft);display:grid;place-items:center;overflow:hidden;color:var(--accent);font:700 64px var(--display)}
.photo img{width:100%;height:100%;object-fit:cover}
.counter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.cgrid{display:grid;grid-template-columns:72px 1fr 72px;gap:10px;align-items:center}
.cbtn{height:72px;border-radius:14px;border:0;font:700 38px/1 var(--display);background:var(--accent-soft);color:var(--accent)}
.cbtn.minus{background:var(--out-soft);color:var(--out)}
.cval{text-align:center}
.cval b{display:block;font:700 54px/1 var(--display);font-variant-numeric:tabular-nums}
.cval span{font-size:13px;color:var(--muted)}
.custom{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:12px}
.custom input{min-width:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.fact span{display:block;font-size:12px;color:var(--muted)}
.fact b{font-weight:600;overflow-wrap:anywhere}
.fact.wide{grid-column:1/-1}
h3{font:700 18px var(--display);text-transform:uppercase;letter-spacing:.03em;margin:22px 0 8px;color:var(--muted)}
.mov{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mov:last-child{border-bottom:0}
.mico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--ok-soft);color:var(--ok)}
.mico.salida{background:var(--out-soft);color:var(--out)} .mico.ajuste{background:var(--accent-soft);color:var(--accent)}
.mtxt{min-width:0}
.mtxt b{font-weight:600;overflow-wrap:anywhere} .mtxt span{display:block;font-size:12.5px;color:var(--muted)}
.mnum{font:700 20px var(--display);font-variant-numeric:tabular-nums;text-align:right}
.mnum span{display:block;font:400 11.5px var(--body);color:var(--muted)}
.day{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:capitalize;margin:16px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 12px}
form{display:flex;flex-direction:column;gap:14px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:5px}
.field input,.field select,.field textarea,.custom input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;min-height:46px}
.field textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.withbtn{display:grid;grid-template-columns:1fr auto;gap:8px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.photopick{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
.photopick .photo{aspect-ratio:1;font-size:36px}
.photopick .btns{display:flex;flex-direction:column;gap:8px}
.sheetfoot{background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px)}
.sheetfoot[hidden]{display:none}
.sheetfoot .in{max-width:608px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:8px}
.sheetfoot .btn{min-height:54px;font-size:16px}
.scanmode{display:flex;align-items:center;gap:8px;max-width:608px;margin:0 auto 12px;padding:8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13.5px;font-weight:600}
.scanmode .live{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast[hidden]{display:none}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:30;display:grid;place-items:end center;padding:16px}
.modal[hidden]{display:none}
.dialog{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:440px;margin-bottom:env(safe-area-inset-bottom)}
.dialog h2{font:700 22px var(--display);text-transform:uppercase;margin:0 0 6px}
.dialog p{margin:0 0 14px;color:var(--muted);overflow-wrap:anywhere}
.dialog .acts{display:flex;flex-direction:column;gap:8px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--bg);padding:2px 6px;border-radius:6px;color:var(--ink)}
.copybox{width:100%;min-height:140px;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.linkbtn{border:0;background:none;padding:0;color:inherit;font-weight:600;text-decoration:underline}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.sheet:not([hidden]){animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="app">
  <header id="hdr"></header>
  <main id="main"></main>
</div>

<nav aria-label="Secciones">
  <div class="inner">
    <button class="tab" data-view="inv" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Inventario</button>
    <button class="tab" data-view="rep"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11M9 12h11M9 19h11"/><path d="M4 5h.01M4 12h.01M4 19h.01"/></svg>Reponer<span class="dot" id="repdot" hidden></span></button>
    <div><button class="scanbtn" id="scanMain" aria-label="Escanear código de barras"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg></button><span class="scanlbl">Escanear</span></div>
    <button class="tab" data-view="mov"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4l-3 3M7 4l3 3"/><path d="M17 20V4M17 20l-3-3M17 20l3-3"/></svg>Movimientos</button>
    <button class="tab" id="addTab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Nuevo</button>
  </div>
</nav>

<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheethead">
    <button class="iconbtn" id="sheetBack" aria-label="Volver"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h2 id="sheetTitle"></h2>
    <span id="sheetAction"></span>
  </div>
  <div class="sheetbody" id="sheetBody"></div>
  <div class="sheetfoot" id="sheetFoot" hidden><div class="in">
    <button class="btn" id="scanNext"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>Escanear siguiente</button>
    <button class="btn sec" id="scanEnd">Terminar</button>
  </div></div>
</section>

<div class="modal" id="modal" hidden><div class="dialog" id="dialog" role="alertdialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<input type="file" id="fileScan" accept="image/*" capture="environment" class="vh" tabindex="-1" aria-hidden="true">
<input type="file" id="fileCam" accept="image/*" capture="environment" class="vh" tabindex="-1" aria-hidden="true">
<input type="file" id="fileGal" accept="image/*" class="vh" tabindex="-1" aria-hidden="true">

<script>
"use strict";
// ---------- estado ----------
const S = { db:null, assets:null, productos:[], movs:[], loaded:false, status:"loading", view:"inv", q:"", cat:"Todas", filtro:null, sheet:null, readonly:false, scan:{ on:false, count:0 }, catList:[] };
const pending = {}; // id -> {delta, timer}
const UNIDADES = ["unidades","cajas","paquetes","botellas","latas","kg","litros","metros"];
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = Number(String(v).replace(",", ".")); return Number.isFinite(n) ? n : 0; };
const fmt = n => (Math.round(n * 100) / 100).toLocaleString("es-ES");
const imgUrl = id => "/_blob/" + id;

function qtyOf(p){ const d = pending[p.id]?.delta || 0; return Math.max(0, (p.cantidad || 0) + d); }
function estado(p){ const q = qtyOf(p); if (q <= 0) return "out"; if ((p.minimo || 0) > 0 && q <= p.minimo) return "low"; return "ok"; }
const ESTADO_TXT = { ok:"Bien", low:"Queda poco", out:"Agotado" };
function initials(n){ return esc((n || "?").trim().slice(0, 2).toUpperCase()); }
function thumb(p, cls="thumb"){ return `<div class="${cls}">${p.foto ? `<img src="${imgUrl(esc(p.foto))}" alt="" loading="lazy" onerror="this.remove()">` : ""}${p.foto ? "" : initials(p.nombre)}</div>`; }

// ---------- conexión ----------
async function init(){
  render();
  let tries = 0;
  while (!window.claude && tries < 30){ await new Promise(r => setTimeout(r, 100)); tries++; }
  if (!window.claude){ S.status = "nodb"; render(); return; }
  try { S.db = await window.claude.use("db"); } catch(e){ S.db = null; }
  try { S.assets = await window.claude.use("assets"); } catch(e){ S.assets = null; }
  if (!S.db){ S.status = "nodb"; render(); return; }
  const timer = setTimeout(() => { if (!S.loaded){ S.status = "slow"; render(); } }, 10000);
  S.db.collection("productos").onSnapshot(snap => {
    S.productos = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    if (!snap.metadata.fromCache){ S.loaded = true; S.status = "ok"; clearTimeout(timer); }
    else if (S.status === "loading") S.status = "cache";
    render();
  }, err => { clearTimeout(timer); S.status = "err"; S.errMsg = err.code; render(); });
  S.db.doc("config/categorias").onSnapshot(d => { S.catList = (d.exists && Array.isArray(d.data().lista)) ? d.data().lista.filter(x => typeof x === "string") : []; render(); }, () => {});
  S.db.collection("movimientos").orderBy("fecha", "desc").limit(400).onSnapshot(snap => {
    S.movs = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, () => {});
}

// ---------- escritura ----------
function writeErr(e){
  if (e && e.code === "invalid_argument") { S.readonly = true; toast("No tienes permiso para guardar cambios aquí."); }
  else if (e && e.code === "quota_exceeded") toast("El almacenamiento está lleno. Borra productos o movimientos antiguos.");
  else toast("No se pudo guardar. Revisa la conexión y vuelve a intentarlo.");
  render();
}
async function logMov(p, tipo, cantidad, resultado, nota){
  await S.db.collection("movimientos").add({ productoId:p.id, nombre:p.nombre || "", unidad:p.unidad || "", tipo, cantidad, resultado, nota:nota || "", fecha:Date.now() });
}
function bump(id, delta){
  if (!S.db || S.readonly) return;
  const p = S.productos.find(x => x.id === id); if (!p) return;
  const cur = pending[id] || { delta:0 };
  if (delta < 0 && qtyOf(p) <= 0) { toast("Ya está a 0."); return; }
  cur.delta += delta; clearTimeout(cur.timer);
  cur.timer = setTimeout(() => flush(id), 900);
  pending[id] = cur; render();
}
async function flush(id){
  const cur = pending[id]; if (!cur) return;
  const p = S.productos.find(x => x.id === id);
  if (!p || !cur.delta){ delete pending[id]; render(); return; }
  const antes = p.cantidad || 0, nueva = Math.max(0, antes + cur.delta), real = nueva - antes;
  try {
    await S.db.doc("productos/" + id).update({ cantidad:nueva, actualizado:Date.now() });
    delete pending[id];
    if (real) await logMov(p, real > 0 ? "entrada" : "salida", Math.abs(real), nueva);
  } catch(e){ delete pending[id]; writeErr(e); }
  render();
}
function flushAll(){ Object.keys(pending).forEach(id => { clearTimeout(pending[id].timer); flush(id); }); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushAll(); });

async function moveBy(id, delta, nota){
  const p = S.productos.find(x => x.id === id); if (!p || !delta) return;
  if (pending[id]){ clearTimeout(pending[id].timer); await flush(id); }
  const p2 = S.productos.find(x => x.id === id);
  const antes = p2.cantidad || 0, nueva = Math.max(0, antes + delta), real = nueva - antes;
  if (!real){ toast("No hay stock suficiente."); return; }
  try {
    await S.db.doc("productos/" + id).update({ cantidad:nueva, actualizado:Date.now() });
    await logMov(p2, real > 0 ? "entrada" : "salida", Math.abs(real), nueva, nota);
    toast(real > 0 ? `+${fmt(real)} ${p2.unidad || ""} guardado` : `−${fmt(-real)} ${p2.unidad || ""} guardado`);
  } catch(e){ writeErr(e); }
}

// ---------- imágenes ----------
function loadImage(file){
  return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => res({ img:i, url:u }); i.onerror = () => { URL.revokeObjectURL(u); rej(new Error("img")); }; i.src = u; });
}
async function resizeToBlob(file, max = 1200, q = 0.82){
  const { img, url } = await loadImage(file);
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  return await new Promise(r => c.toBlob(r, "image/jpeg", q));
}

// ---------- códigos de barras ----------
const FORMATS = ["ean_13","ean_8","upc_a","upc_e","code_128","code_39","code_93","itf","codabar","qr_code","data_matrix"];
let zxingP = null;
function loadZXing(){
  if (window.ZXing) return Promise.resolve();
  if (!zxingP) zxingP = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"; s.onload = res; s.onerror = () => { zxingP = null; rej(new Error("zxing")); }; document.head.appendChild(s); });
  return zxingP;
}
async function decodeBarcode(file){
  const { img, url } = await loadImage(file);
  try {
    if ("BarcodeDetector" in window){
      try {
        const sup = await BarcodeDetector.getSupportedFormats();
        const det = new BarcodeDetector({ formats: FORMATS.filter(f => sup.includes(f)) });
        const r = await det.detect(img);
        if (r && r.length) return r[0].rawValue;
      } catch(e){}
    }
    await loadZXing();
    const Z = window.ZXing;
    const hints = new Map(); hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.MultiFormatReader(); reader.setHints(hints);
    const W = img.naturalWidth, H = img.naturalHeight;
    for (const max of [1400, 900, 2000]){
      for (const rot of [0, 90]){
        const s = Math.min(1, max / Math.max(W, H));
        const w = Math.round(W * s), h = Math.round(H * s);
        const c = document.createElement("canvas");
        c.width = rot ? h : w; c.height = rot ? w : h;
        const g = c.getContext("2d");
        if (rot){ g.translate(h, 0); g.rotate(Math.PI / 2); }
        g.drawImage(img, 0, 0, w, h);
        try {
          const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)));
          const res = reader.decode(bmp); if (res) return res.getText();
        } catch(e){}
      }
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}
let scanTarget = "main";
function startScan(target){
  scanTarget = target;
  if (target === "main"){ flushAll(); if (!S.scan.on){ S.scan.on = true; S.scan.count = 0; } }

}

$("#fileScan").addEventListener("change", async e => {

function dayLabel(ts){
  const d = new Date(ts), t = new Date(); const y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return "Hoy";
  if (d.toDateString() === y.toDateString()) return "Ayer";
  return d.toLocaleDateString("es-ES", { weekday:"long", day:"numeric", month:"long" });
}
const hora = ts => new Date(ts).toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit" });
function movRow(m, showName = true){
  const sig = m.tipo === "salida" ? "−" : m.tipo === "ajuste" ? "=" : "+";
  const label = { entrada:"Entrada", salida:"Salida", ajuste:"Ajuste", alta:"Alta" }[m.tipo] || m.tipo;
  return `<div class="mov"><div class="mico ${esc(m.tipo === "alta" ? "entrada" : m.tipo)}">${sig}</div>
    <div class="mtxt"><b>${showName ? esc(m.nombre) : label}</b><span>${showName ? label + " · " : ""}${hora(m.fecha)}${m.nota ? " · " + esc(m.nota) : ""}</span></div>
    <div class="mnum">${m.tipo === "ajuste" ? fmt(m.resultado) : sig + fmt(m.cantidad)}<span>quedan ${fmt(m.resultado)}</span></div></div>`;
}
function groupedMovs(movs, showName){
  if (!movs.length) return "";
  let html = "", cur = null, buf = [];
  const out = () => { if (buf.length) html += `<p class="day">${esc(cur)}</p><div class="card">${buf.join("")}</div>`; buf = []; };
  movs.forEach(m => { const l = dayLabel(m.fecha); if (l !== cur){ out(); cur = l; } buf.push(movRow(m, showName)); });
  out(); return html;
}
function renderMov(){

  ${sh.fromScan && !p ? `<div class="banner" style="max-width:608px;margin:0 auto 12px">No hay ningún producto con el código <span class="code">${esc(sh.fromScan)}</span>. Créalo aquí o <button type="button" class="linkbtn" id="assignInstead">asígnalo a uno que ya tengas</button>.</div>` : ""}
  <form id="pform" novalidate>
    <div class="photopick">
      <div class="photo">${photoSrc ? `<img src="${esc(photoSrc)}" alt="Foto del producto">` : `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`}</div>
      <div class="btns">${canPhoto ? `
        <button type="button" class="btn sec" id="takePhoto">Hacer foto</button>
        <button type="button" class="btn sec" id="pickPhoto">Elegir de la galería</button>
        ${photoSrc ? `<button type="button" class="btn sec" id="rmPhoto" style="color:var(--out)">Quitar foto</button>` : ""}` : `<p class="hint">Las fotos solo se pueden añadir desde tu cuenta de Claude.</p>`}
      </div>
    </div>
    <div class="field"><label for="f_nombre">Nombre *</label><input id="f_nombre" required value="${esc(v.nombre)}" placeholder="Ej.: Agua mineral 1,5 L" autocomplete="off"></div>
    <div class="field"><label for="f_codigo">Código de barras</label>
      <div class="withbtn"><input id="f_codigo" inputmode="numeric" value="${esc(v.codigo)}" placeholder="Escanéalo o escríbelo" autocomplete="off">
      <button type="button" class="btn sec" id="scanForm" aria-label="Escanear código"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>Escanear</button></div></div>
    <div class="two">
      <div class="field"><label for="f_cantidad">${p ? "Cantidad actual" : "Cantidad inicial"}</label><input id="f_cantidad" type="number" inputmode="decimal" min="0" step="any" value="${esc(p ? qtyOf(p) : v.cantidad)}" placeholder="0"></div>
      <div class="field"><label for="f_unidad">Unidad</label><select id="f_unidad">${[...new Set([...UNIDADES, v.unidad])].map(u => `<option ${u === v.unidad ? "selected" : ""}>${esc(u)}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label for="f_minimo">Avisar cuando queden</label><input id="f_minimo" type="number" inputmode="decimal" min="0" step="any" value="${esc(v.minimo || "")}" placeholder="Ej.: 5 (déjalo vacío para no avisar)"><p class="hint">Con esa cantidad o menos aparece en "Por reponer".</p></div>
    <div class="two">
      <div class="field"><label for="f_categoria">Categoría</label><select id="f_categoria"><option value="">Sin categoría</option>${[...new Set([...categorias(), (v.categoria || "").trim()].filter(Boolean))].sort((a,b) => a.localeCompare(b, "es")).map(c => `<option ${c === v.categoria ? "selected" : ""}>${esc(c)}</option>`).join("")}<option value="__new">+ Nueva categoría…</option></select>
        <input id="f_catnew" placeholder="Nombre de la categoría" autocomplete="off" style="margin-top:8px" hidden></div>
      <div class="field"><label for="f_ubicacion">Ubicación</label><input id="f_ubicacion" list="dl_ubi" value="${esc(v.ubicacion)}" placeholder="Ej.: Estantería 2" autocomplete="off"></div>
    </div>
    <datalist id="dl_ubi">${ubicaciones().map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    <div class="field"><label for="f_notas">Notas</label><textarea id="f_notas" placeholder="Proveedor, caducidad, lo que quieras recordar">${esc(v.notas)}</textarea></div>
    <button type="submit" class="btn block" id="saveBtn">${p ? "Guardar cambios" : "Añadir producto"}</button>
    ${p ? `<button type="button" class="btn danger block" id="delBtn">Eliminar producto</button>` : ""}
    ${S.scan.on && !p ? `<button type="button" class="btn sec block" id="skipNext">No crearlo y escanear otro</button>` : ""}
  </form>`;
}

async function saveForm(){
  const sh = S.sheet, p = sh.id ? S.productos.find(x => x.id === sh.id) : null;
  const g = id => $("#" + id).value.trim();
  const nombre = g("f_nombre");
  if (!nombre){ toast("Ponle un nombre al producto."); $("#f_nombre").focus(); return; }
  const codigo = g("f_codigo");
  if (codigo){ const dup = S.productos.find(x => x.codigo === codigo && x.id !== sh.id); if (dup){ toast(`Ese código ya es de "${dup.nombre}".`); return; } }
  const cantidad = Math.max(0, num(g("f_cantidad") || 0));
  let categoria = $("#f_categoria").value;
  if (categoria === "__new"){ categoria = g("f_catnew"); if (!categoria){ toast("Escribe el nombre de la nueva categoría."); $("#f_catnew").focus(); return; } }
  const data = { nombre, codigo, categoria, ubicacion:g("f_ubicacion"), unidad:$("#f_unidad").value, minimo:Math.max(0, num(g("f_minimo") || 0)), notas:g("f_notas"), actualizado:Date.now() };
  const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "Guardando…";
  try {
    if (categoria && !S.catList.includes(categoria)) await saveCatList([...categorias(), categoria]);
    let oldPhoto = p?.foto || "";
    if (sh.newPhoto){
      const up = await S.assets.upload(sh.newPhoto, { type:"image/jpeg" });
      data.foto = up.id;
    } else if (sh.removePhoto) data.foto = "";
    else data.foto = oldPhoto;
    if (p){
      if (pending[p.id]){ clearTimeout(pending[p.id].timer); await flush(p.id); }
      const antes = S.productos.find(x => x.id === p.id)?.cantidad || 0;
      data.cantidad = cantidad;
      await S.db.doc("productos/" + p.id).set(clean({ ...p, ...data, creado:p.creado || Date.now() }));
      if (cantidad !== antes) await logMov({ id:p.id, ...data }, "ajuste", Math.abs(cantidad - antes), cantidad, `antes ${fmt(antes)}`);
      if (oldPhoto && data.foto !== oldPhoto && S.assets){ try { await S.assets.delete(oldPhoto); } catch(e){} }
      toast("Cambios guardados");
      if (sh.newPhotoUrl) URL.revokeObjectURL(sh.newPhotoUrl);
      S.sheet = { type:"ficha", id:p.id }; renderSheet();
    } else {
      data.cantidad = cantidad; data.creado = Date.now();
      const ref = S.db.collection("productos").doc();
      await ref.set(data);
      if (cantidad > 0) await logMov({ id:ref.id, ...data }, "alta", cantidad, cantidad, "producto nuevo");
      toast("Producto añadido");
      if (sh.newPhotoUrl) URL.revokeObjectURL(sh.newPhotoUrl);
      S.sheet = { type:"ficha", id:ref.id }; renderSheet();
    }
  } catch(e){
    btn.disabled = false; btn.textContent = p ? "Guardar cambios" : "Añadir producto";
    if (e && e.code === "too_large") toast("La foto es demasiado grande.");
    else writeErr(e);
  }
}
function clean(o){ const r = {}; for (const k in o){ if (o[k] !== undefined && k !== "id") r[k] = o[k]; } return r; }

async function onPhoto(file){
  if (!file) return;
  try {
    const blob = await resizeToBlob(file);
    if (S.sheet.newPhotoUrl) URL.revokeObjectURL(S.sheet.newPhotoUrl);
    keepFormValues();
    S.sheet.newPhoto = blob; S.sheet.newPhotoUrl = URL.createObjectURL(blob); S.sheet.removePhoto = false;
    renderForm();
  } catch(e){ toast("No se pudo abrir la foto."); }
}
function keepFormValues(){
  if (!$("#pform")) return;
  const g = id => $("#" + id)?.value ?? "";
  S.sheet.preset = { nombre:g("f_nombre"), codigo:g("f_codigo"), cantidad:g("f_cantidad"), unidad:g("f_unidad"), minimo:g("f_minimo"), categoria:g("f_categoria") === "__new" ? g("f_catnew") : g("f_categoria"), ubicacion:g("f_ubicacion"), notas:g("f_notas") };
}
$("#fileCam").addEventListener("change", e => onPhoto(e.target.files[0]));
$("#fileGal").addEventListener("change", e => onPhoto(e.target.files[0]));

// ---------- eventos ----------
document.addEventListener("click", e => {
  const t = e.target;
  const tab = t.closest(".tab[data-view]");
  if (tab){ S.view = tab.dataset.view; S.filtro = null; $("#main").scrollTop = 0; render(); return; }
  if (t.closest("#addTab") || t.closest("[data-new]")){ if (S.readonly || !S.db){ toast("No se puede añadir sin conexión a los datos."); return; } openForm(null); return; }
  if (t.closest("#scanMain")){ startScan("main"); return; }
  const st = t.closest(".stat"); if (st){ S.filtro = st.dataset.f || null; render(); return; }
  if (t.closest("#manageCats")){ S.sheet = { type:"cats" }; renderSheet(); return; }
  const chip = t.closest(".chip[data-cat]"); if (chip){ S.cat = chip.dataset.cat; render(); return; }
  const op = t.closest("[data-open]"); if (op){ if (S.sheet?.type !== "link") { S.scan.on = false; S.scan.count = 0; } openFicha(op.dataset.open); return; }
  const bp = t.closest("[data-bump]"); if (bp && S.sheet?.type === "ficha"){ bump(S.sheet.id, num(bp.dataset.bump)); return; }
  const cu = t.closest("[data-custom]");
  if (cu && S.sheet?.type === "ficha"){
    const n = num($("#customQty").value);
    if (!(n > 0)){ toast("Escribe una cantidad mayor que 0."); return; }
    $("#customQty").value = ""; moveBy(S.sheet.id, n * num(cu.dataset.custom)); return;
  }
  if (t.closest("#editBtn")){ const id = S.sheet.id; flushAll(); openForm(id); S.sheet.back = id; return; }
  if (t.closest("#takePhoto")){ const f = $("#fileCam"); f.value = ""; f.click(); return; }
  if (t.closest("#pickPhoto")){ const f = $("#fileGal"); f.value = ""; f.click(); return; }
  if (t.closest("#rmPhoto")){ keepFormValues(); if (S.sheet.newPhotoUrl) URL.revokeObjectURL(S.sheet.newPhotoUrl); S.sheet.newPhoto = null; S.sheet.newPhotoUrl = null; S.sheet.removePhoto = true; renderForm(); return; }
  if (t.closest("#scanForm")){ startScan("form"); return; }
  if (t.closest("#manageCats")){ S.sheet = { type:"cats" }; renderSheet(); return; }
  const rc = t.closest("[data-rencat]");
  if (rc){ const old = rc.dataset.rencat;
    dialog(`<h2>Renombrar categoría</h2><div class="field"><label for="rcn">Nuevo nombre</label><input id="rcn" value="${esc(old)}" autocomplete="off"></div><div class="acts" style="margin-top:12px"><button class="btn" data-a="ok">Guardar</button><button class="btn sec" data-a="close">Cancelar</button></div>`,
      { ok:() => { const v = $("#rcn").value; closeDialog(); renameCat(old, v); } }); return; }
  const dc = t.closest("[data-delcat]");
  if (dc){ const name = dc.dataset.delcat, n = S.productos.filter(p => p.categoria === name).length;
    confirmar("Eliminar categoría", n ? `Los ${n} producto${n === 1 ? "" : "s"} de "${name}" quedarán sin categoría. No se borra ningún producto.` : `Se eliminará la categoría "${name}".`, "Eliminar", () => deleteCat(name)); return; }
  if (t.closest("#scanNext") || t.closest("#skipNext")){ startScan("main"); return; }
  if (t.closest("#scanEnd")){ endScan(); toast("Escaneo terminado"); return; }
  if (t.closest("#assignInstead")){ openLink(S.sheet.fromScan); return; }
  if (t.closest("#delBtn")){
    const p = S.productos.find(x => x.id === S.sheet.id);
    confirmar("Eliminar producto", `Se borrará "${p.nombre}" del inventario. Su historial de movimientos se conserva.`, "Eliminar", async () => {
      try { await S.db.doc("productos/" + p.id).delete(); if (p.foto && S.assets){ try { await S.assets.delete(p.foto); } catch(e){} } S.sheet = null; $("#sheet").hidden = true; updateFoot(); toast("Producto eliminado"); render(); }
      catch(err){ writeErr(err); }
    }); return;
  }
  const as = t.closest("[data-assign]");
  if (as && S.sheet?.type === "link"){
    const p = S.productos.find(x => x.id === as.dataset.assign), code = S.sheet.code;
    S.db.doc("productos/" + p.id).update({ codigo:code, actualizado:Date.now() }).then(() => { toast("Código asignado a " + p.nombre); openFicha(p.id); }).catch(writeErr); return;
  }
  if (t.closest("#copyRep")){
    const txt = "Pedido para el almacén:\n" + reponer().map(p => { const falta = Math.max(0, (p.minimo || 0) * 2 - qtyOf(p)); return `- ${p.nombre}: quedan ${fmt(qtyOf(p))} ${p.unidad || ""}${falta ? ` (pedir unas ${fmt(falta)})` : ""}`; }).join("\n");
    const fallback = () => dialog(`<h2>Copia la lista</h2><p>Mantén pulsado el texto para copiarlo.</p><textarea class="copybox" readonly>${esc(txt)}</textarea><div class="acts" style="margin-top:10px"><button class="btn sec" data-a="close">Cerrar</button></div>`);
    try { navigator.clipboard.writeText(txt).then(() => toast("Lista copiada. Pégala en WhatsApp."), fallback); } catch(err){ fallback(); }
    return;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "f_categoria"){ const n = $("#f_catnew"); n.hidden = e.target.value !== "__new"; if (!n.hidden) n.focus(); }
});
document.addEventListener("input", e => { if (e.target.id === "q"){ S.q = e.target.value; renderInv(); } });
document.addEventListener("submit", async e => {
  if (e.target.id === "pform"){ e.preventDefault(); saveForm(); }
  if (e.target.id === "catform"){
    e.preventDefault(); const v = $("#newcat").value.trim(); if (!v) return;
    if (categorias().some(c => c.toLowerCase() === v.toLowerCase())){ toast("Esa categoría ya existe."); return; }
    try { await saveCatList([...categorias(), v]); toast("Categoría añadida"); renderSheet(); setTimeout(() => $("#newcat")?.focus(), 50); } catch(err){ writeErr(err); }
  }
});
async function renameCat(oldName, newName){
  newName = newName.trim(); if (!newName || newName === oldName) return;
  try {
    await saveCatList([...categorias().filter(c => c !== oldName), newName]);
    for (const p of S.productos.filter(p => p.categoria === oldName)) await S.db.doc("productos/" + p.id).update({ categoria:newName, actualizado:Date.now() });
    if (S.cat === oldName) S.cat = newName;
    toast("Categoría renombrada"); renderSheet();
  } catch(err){ writeErr(err); }
}
async function deleteCat(name){
  try {
    await saveCatList(categorias().filter(c => c !== name));
    for (const p of S.productos.filter(p => p.categoria === name)) await S.db.doc("productos/" + p.id).update({ categoria:"", actualizado:Date.now() });
    toast("Categoría eliminada"); renderSheet();
  } catch(err){ writeErr(err); }
}
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (!$("#modal").hidden) closeDialog(); else if (S.sheet) closeSheet(); } });

init();
</script>
</body>
