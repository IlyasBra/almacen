<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Almacén: controla el stock del almacén de la tienda." />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      // Applies the saved theme before the first paint, so dark mode never flashes white.
      try {
        var saved = JSON.parse(localStorage.getItem('almacen:theme') || '"system"')
        var dark =
          saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0f172a' : '#f8fafc')
      } catch (error) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Almacén" />
    <title>Almacén</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
